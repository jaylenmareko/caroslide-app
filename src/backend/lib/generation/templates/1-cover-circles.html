<!-- VARIANT 1: Cover-circles. Full-bleed photo, bottom-fade to black, 2 circle insets near top,
     caption in the black zone at the bottom. Best as slide 1 (the hook) with the circles showing
     two different "before" teasers, or as an inner slide with circles as a before/after pair.

     FORMAT SCALING: canvas width is 1080 for every supported format (post/square/story) — only
     height differs (1350 / 1080 / 1920). So horizontal values, fixed-element sizes (circle
     diameter, logo, borders, font-size) stay in px unchanged; only the vertical offsets that
     define the photo/text split are expressed in vh (percent of whatever height this render
     actually uses), computed here as original_px / 1350 * 100 against the reference design. -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
{{FONT_LINK_HTML|}}
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1080px; height:{{CANVAS_H}}px; overflow:hidden; background:#0a0a0a; font-family:{{FONT_FAMILY|'Segoe UI', Arial, sans-serif}}; }
  .slide { width:1080px; height:{{CANVAS_H}}px; position:relative; }
  .photo { position:absolute; inset:0; background-image:url('{{BG_IMG}}'); background-size:cover; background-position:{{BG_POSITION|50% 20%}}; }
  .scrim-bottom { position:absolute; bottom:0; left:0; right:0; height:56.3vh; background:linear-gradient(0deg, rgba(0,0,0,0.97) 0%, rgba(0,0,0,0.85) 40%, rgba(0,0,0,0) 100%); }
  .scrim-top { position:absolute; top:0; left:0; right:0; height:16.3vh; background:linear-gradient(180deg, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0) 100%); }
  /* transform: manual move support (2026-07-24) -- same 0px,0px-default convention throughout.
     LOGO_HTML_DISPLAY (2026-07-26): a real, reversible on/off toggle, same visibility (not display)
     convention as DIVIDER_DISPLAY below -- lets a user delete the logo via the click-in-place
     editor without needing a template layout change. */
  .logo { position:absolute; top:3.7vh; left:60px; font-size:34px; font-weight:900; letter-spacing:1px; z-index:5; visibility:{{LOGO_HTML_DISPLAY|visible}}; transform:translate({{LOGO_HTML_POS_X|0px}}, {{LOGO_HTML_POS_Y|0px}}); }
  .logo .a { color:{{PRIMARY}}; }
  .logo .b { color:#ffffff; }
  .logo img { height:34px; width:auto; display:block; } /* used instead of .a/.b spans when the brand has a real logo image, see LOGO_HTML */

  /* Bumped 280px -> 320px 2026-07-20 per Jaylen -- read small next to Spotlight's single 410px
     circle. left/right recomputed to keep the same proportional margins/gap (150/200/170 ->
     125/170/145) rather than just growing outward into the edges or into each other. */
  /* CIRCLES_DISPLAY added 2026-07-21: the 2-circle motif is a strong, distinctive "proof" device
     meant for a cover, not identical repetition across 4 slides (real complaint + confirmed via a
     real RanchPad carousel, whose actual inner slides drop the circles entirely). Cover slide sets
     this to `block` (default), slides 2-4 set it to `none` via pipeline.ts -- everything else
     (photo, scrims, divider, caption) keeps working independently since circles are absolutely
     positioned, not in normal flow. */
  .circle-wrap { position:absolute; top:9.63vh; width:320px; height:320px; display:{{CIRCLES_DISPLAY|block}}; }
  /* transform: translate() offsets (2026-07-24) -- manual move support in the click-in-place
     editor. Default 0px,0px leaves every existing carousel's circle position unchanged. */
  .circle-wrap.left { left:125px; transform:translate({{CIRCLE_L_IMG_POS_X|0px}}, {{CIRCLE_L_IMG_POS_Y|0px}}); }
  .circle-wrap.right { left:615px; transform:translate({{CIRCLE_R_IMG_POS_X|0px}}, {{CIRCLE_R_IMG_POS_Y|0px}}); }
  .circle { width:100%; height:100%; border-radius:50%; border:9px solid #ffffff; box-shadow:0 10px 30px rgba(0,0,0,0.45); overflow:hidden; background:#111; }
  .circle img { width:100%; height:100%; object-fit:cover; object-position:{{CIRCLE_POSITION|50% 25%}}; }

  /* Divider hidden alongside the circles on inner slides (2026-07-21, real feedback: a stray line
     with nothing above it looked orphaned once the circles were gone) -- reuses CIRCLES_DISPLAY
     rather than a separate placeholder since the two are always toggled together (display:none
     always wins regardless of visibility, so this still fully hides on inner slides). DIVIDER_DISPLAY
     is a SEPARATE, independent user-delete toggle (2026-07-24) -- visibility (not display) so it
     composes with CIRCLES_DISPLAY instead of overriding it; a hidden element still holds its layout
     space, which is fine for a thin line with nothing depending on its box. transform: manual move,
     same convention as everywhere else. */
  .divider { position:absolute; top:54.67vh; left:108px; right:108px; height:3px; background:#ffffff; display:{{CIRCLES_DISPLAY|block}}; visibility:{{DIVIDER_DISPLAY|visible}}; transform:translate({{DIVIDER_POS_X|0px}}, {{DIVIDER_POS_Y|0px}}); }
  /* Caption box now spans the whole zone below where the divider sits (54.67vh to the bottom) and
     vertically centers its content via flex, instead of a fixed top offset -- real feedback
     (2026-07-21): a short caption anchored near the top of a large black zone (now emptier with
     circles/divider gone on inner slides) read as sparse/stranded, with a lot of dead space below
     it. Centering makes a short caption look deliberate regardless of how many lines it runs. */
  .caption { position:absolute; top:54.67vh; bottom:0; left:100px; right:100px; display:flex; align-items:center; justify-content:center; }
  /* Real content (the multiple .c1/.c2/.c3 spans) lives in this inner block, not directly in the
     flex container above -- a flex container turns its direct children into flex items laid out
     in a row, which would break the spans' normal text-wrapping. This inner block stays a normal
     block element so its own content wraps exactly as it always did; the outer .caption only
     centers this one block as a whole. */
  /* CAPTION_SIZE placeholder added 2026-07-24 -- this template previously hardcoded 50px with no
     override at all, meaning the automatic guardrail-shrink system (pipeline.ts's
     SIZE_OVERRIDE_FOR maps CAPTION_HTML -> CAPTION_SIZE for every template using this field) was
     silently computing a shrink value here that this template just ignored. Real gap, found while
     wiring up manual resize -- fixed as part of the same change, default matches the original
     hardcoded 50px so nothing changes unless an override is actually set. POS_X/POS_Y: manual move
     support, same 0px,0px-default convention as the circles above. */
  .caption-inner { text-align:center; font-size:{{CAPTION_SIZE|50px}}; font-weight:800; line-height:1.32; transform:translate({{CAPTION_HTML_POS_X|0px}}, {{CAPTION_HTML_POS_Y|0px}}); }
  /* caption spans use classes .c1 (secondary accent), .c2 (white/body), .c3 (primary accent).
     text-shadow added 2026-07-21 -- real feedback: a brand's own PRIMARY/SECONDARY color can pass
     the documented luminance-contrast check (see templates-guide.md) against a pure #0a0a0a
     background and still read poorly in practice, since the scrim above this zone isn't 100%
     opaque and real photo color bleeds through underneath it. A shadow is a robust backstop that
     doesn't depend on getting threshold math exactly right for every possible brand color. */
  .caption .c1 { color:{{SECONDARY}}; text-shadow:0 2px 6px rgba(0,0,0,0.55); }
  .caption .c2 { color:#ffffff; text-shadow:0 2px 6px rgba(0,0,0,0.55); }
  .caption .c3 { color:{{PRIMARY}}; text-shadow:0 2px 6px rgba(0,0,0,0.55); }
</style>
</head>
<body>
  <div class="slide">
    <div class="photo"></div>
    <div class="scrim-bottom"></div>
    <div class="scrim-top"></div>
    <div class="logo">{{LOGO_HTML}}</div>

    <div class="circle-wrap left">
      <div class="circle"><img src="{{CIRCLE_L_IMG}}" alt=""></div>
    </div>
    <div class="circle-wrap right">
      <div class="circle"><img src="{{CIRCLE_R_IMG}}" alt=""></div>
    </div>

    <div class="divider"></div>
    <div class="caption">
      <div class="caption-inner">{{CAPTION_HTML}}</div>
    </div>
  </div>
</body>
</html>
