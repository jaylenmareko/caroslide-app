<!-- VARIANT 4: Vertical split. One full-height photo column, one full-height solid-color text
     column (~600px photo / ~480px text — not 50/50, photo column should read as dominant).
     Alternate which side the photo is on between slides (row-reverse) so the carousel doesn't
     feel static. Cover slide swaps the circle for a big stat number + label.

     FORMAT SCALING: the split runs along the WIDTH axis, which is constant (1080) across every
     format, and both columns are full-height with vertically-centered content — so this template
     needs NO conversion at all. Just change {{CANVAS_H}}. Easiest template to reuse across formats. -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
{{FONT_LINK_HTML|}}
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1080px; height:{{CANVAS_H}}px; overflow:hidden; background:#0a0a0a; font-family:{{FONT_FAMILY|'Segoe UI', Arial, sans-serif}}; }
  .slide { width:1080px; height:{{CANVAS_H}}px; position:relative; display:flex; {{ROW_DIRECTION|flex-direction:row;}} }

  .photocol { width:600px; height:{{CANVAS_H}}px; position:relative; overflow:hidden; background:#3a3a3a; }
  .photocol img { width:100%; height:100%; object-fit:cover; object-position:{{BG_POSITION|50% 20%}}; display:block; }
  .side-fade { position:absolute; top:0; {{FADE_SIDE|right}}:0; bottom:0; width:140px; background:linear-gradient({{FADE_ANGLE|90deg}}, rgba(10,10,10,0) 0%, #0a0a0a 100%); z-index:2; }

  .textcol { width:480px; height:{{CANVAS_H}}px; background:#0a0a0a; display:flex; flex-direction:column; justify-content:center; padding:60px 50px; position:relative; }
  .logo { position:absolute; top:50px; {{LOGO_SIDE|left}}:50px; font-size:28px; font-weight:900; letter-spacing:1px; }
  .logo .a { color:{{PRIMARY}}; } .logo .b { color:#ffffff; }
  .logo img { height:28px; width:auto; display:block; } /* used instead of .a/.b spans when the brand has a real logo image, see LOGO_HTML */

  .tagline { font-size:28px; font-weight:800; color:{{SECONDARY}}; letter-spacing:1px; text-transform:uppercase; margin-bottom:30px; transform:translate({{TAGLINE_POS_X|0px}}, {{TAGLINE_POS_Y|0px}}); }
  /* Bumped 118px -> 165px (2026-07-11, Jaylen: "bold stat needs to be very big") — this is the whole
     point of this look, the number should dominate the column at a glance, not read as a normal
     headline. Tighter -6px letter-spacing (was -4px) keeps 4-character stats ("100%", "2.5x") from
     overflowing the 380px usable textcol width (480px column - 50px padding each side). Still render
     an actual test slide for any stat string before shipping — same caution as template 5's
     STRIP_POSITION note, a size that fits "80%" isn't guaranteed to fit every stat. Confirmed live:
     "500M" (4 chars, all wide numerals/letterforms — no narrow "1" or "%" to lean on) still clipped
     off the right edge at 165px. Use the STAT_SIZE placeholder to size down per-stat rather than shrinking the
     default for every carousel — e.g. 130px for a 4-5 char wide-glyph stat like this one. */
  .stat { font-size:{{STAT_SIZE|165px}}; font-weight:900; color:{{SECONDARY}}; letter-spacing:-6px; line-height:1; margin-bottom:8px; transform:translate({{STAT_NUMBER_POS_X|0px}}, {{STAT_NUMBER_POS_Y|0px}}); }
  .statlbl { font-size:26px; font-weight:700; color:#9a9a9a; letter-spacing:1px; text-transform:uppercase; margin-bottom:40px; transform:translate({{STAT_LABEL_POS_X|0px}}, {{STAT_LABEL_POS_Y|0px}}); }
  .caption { font-size:38px; font-weight:800; line-height:1.34; transform:translate({{CAPTION_HTML_POS_X|0px}}, {{CAPTION_HTML_POS_Y|0px}}); }
  .caption .c1 { color:{{SECONDARY}}; }
  .caption .c2 { color:#ffffff; }
  .caption .c3 { color:{{PRIMARY}}; }

  /* proof circle bleeds off the OUTER edge of the photo column (canvas edge) — keep offset
     small (~20px) or the tag label gets clipped by the canvas boundary.
     .tag is a SIBLING of .circle, not a child — see the same note in 1-cover-circles.html.
     Nesting the tag inside .circle's overflow:hidden clips it against the circular mask, not a
     rectangular one — on this template's small 180px circle that clips the text itself, not just
     the pill's rounded ends. */
  /* Circle markup itself is NOT static template HTML — it's the whole CIRCLE_BLOCK placeholder value
     (see below), so it can be cleanly omitted (empty default) instead of requiring post-fill HTML
     surgery to remove it. Never hand-edit generated HTML to strip a circle — that's how an
     orphaned tag span survived a broken regex once and silently rendered "Before" on a carousel
     that made no before/after claim. If no circle is needed, just don't set CIRCLE_BLOCK. */
  .circle-wrap { position:absolute; {{CIRCLE_SIDE|left}}:-20px; bottom:130px; width:180px; height:180px; z-index:5; }
  .circle { width:100%; height:100%; border-radius:50%; border:8px solid #ffffff; overflow:hidden; box-shadow:0 10px 24px rgba(0,0,0,0.5); background:#111; }
  .circle img { width:100%; height:100%; object-fit:cover; object-position:{{CIRCLE_POSITION|50% 22%}}; }
  .tag { position:absolute; bottom:-2px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,0.85); border:1px solid #555; color:#fff; font-size:13px; font-weight:800; letter-spacing:1px; text-transform:uppercase; padding:3px 12px; border-radius:100px; white-space:nowrap; z-index:6; }
</style>
</head>
<body>
  <div class="slide">
    <div class="photocol">
      <img src="{{BG_IMG}}" alt="">
      <div class="side-fade"></div>
      {{CIRCLE_BLOCK|}}
    </div>
    <div class="textcol">
      <div class="logo">{{LOGO_HTML}}</div>
      <!-- cover slide: use .stat + .statlbl. inner slides: use .tagline + .caption -->
      <div class="stat">{{STAT_NUMBER}}</div>
      <div class="statlbl">{{STAT_LABEL}}</div>
      <div class="tagline">{{TAGLINE}}</div>
      <div class="caption">{{CAPTION_HTML}}</div>
    </div>
  </div>
</body>
</html>
