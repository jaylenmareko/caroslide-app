<!-- VARIANT 11: Single circle. Full-bleed photo (no black text zone at all, same base as
     6-minimal-magazine.html) with ONE circular inset in the top-right corner instead of two
     circles bottom-anchored (1-cover-circles.html) or two circles at the photo seam
     (3-flip.html). Headline sits directly on the photo over a bottom scrim, same dual/triple-mode
     kicker+headline / story / stat pattern as 6-minimal-magazine.html. No tag on the circle by
     design — this isn't a before/after pairing, it's a single supporting/reaction photo (e.g. a
     news-style "main photo + related person" layout), so a tag would imply a claim that isn't
     being made.

     FORMAT SCALING: circle is anchored top-right via fixed px (top/right), headline block anchored
     bottom via fixed px, same as 6-minimal-magazine.html — needs zero conversion, just
     {{CANVAS_H}}. -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
{{FONT_LINK_HTML|}}
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1080px; height:{{CANVAS_H}}px; overflow:hidden; background:#0a0a0a; font-family:{{FONT_FAMILY|'Segoe UI', Arial, sans-serif}}; }
  .slide { width:1080px; height:{{CANVAS_H}}px; position:relative; overflow:hidden; }
  .photo { position:absolute; inset:0; background:#3a3a3a; }
  .photo img { width:100%; height:100%; object-fit:cover; object-position:{{BG_POSITION|50% 15%}}; display:block; }
  .top-scrim { position:absolute; top:0; left:0; right:0; height:220px; background:linear-gradient(180deg, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0) 100%); }
  .bottom-scrim { position:absolute; bottom:0; left:0; right:0; height:{{SCRIM_H|760px}}; background:linear-gradient(0deg, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.55) 45%, rgba(0,0,0,0) 100%); }

  .logo { position:absolute; top:50px; left:60px; font-size:32px; font-weight:900; letter-spacing:1px; text-shadow:0 2px 10px rgba(0,0,0,0.5); z-index:6; }
  .logo .a { color:{{PRIMARY}}; } .logo .b { color:#ffffff; }
  .logo img { height:46px; width:auto; display:block; filter:drop-shadow(0 2px 4px rgba(0,0,0,0.9)) drop-shadow(0 0 16px rgba(0,0,0,0.6)); } /* used instead of .a/.b spans when the brand has a real logo image, see LOGO_HTML — layered shadow keeps a real logo image legible against any photo, not just dark ones */

  /* Size measured directly off a real reference screenshot (IMG_3583, a KTLA breaking-news graphic)
     at 1320x1640 -- circle spans x:785-1285, y:195-690, i.e. ~500px diameter, 195px off the top.
     Scaled by width-ratio (1080/1320 = 0.818, applied uniformly to both axes so the circle stays a
     true circle) to this template's 1080-wide canvas: ~410px diameter, 160px off the top.
     CIRCLE_OFFSET deliberately nudged past the reference's exact 29px (35px scaled) -- 60px, then
     120px per two rounds of Jaylen feedback 2026-07-20 -- the tighter edge-hug read fine against
     the reference but felt cramped across other real photos.
     CIRCLE_SIDE mirrors the same left/right pattern as 4-vertical-split.html's CIRCLE_SIDE/LOGO_SIDE
     (the placeholder becomes the actual CSS property name -- left or right) -- one template file
     serves both the right-side "Spotlight" wizard Style and the left-side mirror, not two files. */
  .circle-wrap { position:absolute; top:{{CIRCLE_TOP|160px}}; {{CIRCLE_SIDE|right}}:{{CIRCLE_OFFSET|120px}}; width:{{CIRCLE_SIZE|410px}}; height:{{CIRCLE_SIZE|410px}}; z-index:5; transform:translate({{CIRCLE_IMG_POS_X|0px}}, {{CIRCLE_IMG_POS_Y|0px}}); }
  .circle { width:100%; height:100%; border-radius:50%; border:9px solid #ffffff; box-shadow:0 10px 30px rgba(0,0,0,0.45); overflow:hidden; background:#111; }
  .circle img { width:100%; height:100%; object-fit:cover; object-position:{{CIRCLE_POSITION|50% 25%}}; }

  /* kicker+headline used to be two independently bottom-anchored elements with a hardcoded 290px
     gap between their anchor points -- a headline long enough to wrap past ~4 lines grew upward
     past the kicker's fixed position and visually collided with it (real bug, caught 2026-07-20
     via a boundary-length render test, same fix as 6-minimal-magazine.html). Fixed by wrapping
     both in one bottom-anchored flex column (.cover-block) so the kicker always sits directly
     above the headline and the whole block grows upward together as a unit. */
  .cover-block { position:absolute; left:70px; right:70px; bottom:110px; display:flex; flex-direction:column; }
  /* text-shadow extended to kicker/headline/story 2026-07-21 (previously only .stat/.statlbl had
     it, a real inconsistency within this same file) -- see 6-minimal-magazine.html's matching
     comment for why this template needs it (photo-scrim background, not solid black). */
  .kicker { font-size:28px; font-weight:800; letter-spacing:2px; text-transform:uppercase; color:{{SECONDARY_LIGHT|#f87171}}; margin-bottom:14px; text-shadow:0 2px 6px rgba(0,0,0,0.55); transform:translate({{KICKER_POS_X|0px}}, {{KICKER_POS_Y|0px}}); }
  .kicker:empty { margin-bottom:0; line-height:0; }
  .headline { font-size:{{HEADLINE_SIZE|56px}}; font-weight:900; line-height:1.18; color:#ffffff; letter-spacing:-1px; text-wrap:balance; text-shadow:0 2px 6px rgba(0,0,0,0.55); transform:translate({{HEADLINE_HTML_POS_X|0px}}, {{HEADLINE_HTML_POS_Y|0px}}); }
  .headline .accent { color:{{SECONDARY}}; }
  /* narrative/story slides use a running paragraph instead of kicker+headline */
  .story { position:absolute; left:70px; right:90px; bottom:130px; font-size:{{STORY_SIZE|42px}}; font-weight:700; line-height:1.4; color:#ffffff; text-shadow:0 2px 6px rgba(0,0,0,0.55); transform:translate({{STORY_HTML_POS_X|0px}}, {{STORY_HTML_POS_Y|0px}}); }
  .story .accent { color:{{PRIMARY}}; }
  .story .muted { color:#9a9a9a; }

  .stat { position:absolute; left:70px; right:70px; bottom:180px; font-size:{{STAT_SIZE|140px}}; font-weight:900; color:#ffffff; letter-spacing:-3px; line-height:1; text-align:center; text-shadow:0 2px 14px rgba(0,0,0,0.6); transform:translate({{STAT_NUMBER_POS_X|0px}}, {{STAT_NUMBER_POS_Y|0px}}); }
  .statlbl { position:absolute; left:70px; right:70px; bottom:110px; font-size:28px; font-weight:700; color:#e5e5e5; letter-spacing:1px; text-transform:uppercase; text-align:center; text-shadow:0 2px 8px rgba(0,0,0,0.6); transform:translate({{STAT_LABEL_POS_X|0px}}, {{STAT_LABEL_POS_Y|0px}}); }
</style>
</head>
<body>
  <div class="slide">
    <div class="photo"><img src="{{BG_IMG}}" alt=""></div>
    <div class="top-scrim"></div>
    <div class="bottom-scrim"></div>
    <div class="logo">{{LOGO_HTML}}</div>

    <!-- omit entirely on a slide that doesn't need the inset (e.g. a pure text/CTA slide) -->
    <div class="circle-wrap">
      <div class="circle"><img src="{{CIRCLE_IMG}}" alt=""></div>
    </div>

    <!-- cover/resolution slides: use kicker+headline, leave STORY_HTML/STAT_NUMBER empty.
         narrative/story slides: use STORY_HTML, leave the other two pairs empty.
         stat takeover: use STAT_NUMBER + STAT_LABEL, leave KICKER/HEADLINE_HTML/STORY_HTML empty.
         an empty div renders invisibly, so leaving unused pairs blank is safe. -->
    <div class="cover-block">
      <div class="kicker">{{KICKER|}}</div>
      <div class="headline">{{HEADLINE_HTML|}}</div>
    </div>
    <div class="story">{{STORY_HTML|}}</div>
    <div class="stat">{{STAT_NUMBER|}}</div>
    <div class="statlbl">{{STAT_LABEL|}}</div>
  </div>
</body>
</html>
