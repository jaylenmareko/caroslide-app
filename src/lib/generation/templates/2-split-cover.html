<!-- VARIANT 2: Split-cover. Two photos side-by-side (edge to edge, no circles/borders) fill the top
     ~43% of the frame, caption sits below on solid black. Good for "two examples" hooks. Use
     .reversed on .split (flex-direction:row-reverse) to mirror it on alternating slides.

     FORMAT SCALING: see note in 1-cover-circles.html — width is fixed at 1080 across formats,
     only the vertical split point (.split height) is expressed in vh. -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
{{FONT_LINK_HTML|}}
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1080px; height:{{CANVAS_H}}px; overflow:hidden; background:#0a0a0a; font-family:{{FONT_FAMILY|'Segoe UI', Arial, sans-serif}}; }
  .slide { width:1080px; height:{{CANVAS_H}}px; position:relative; display:flex; flex-direction:column; }
  .split { width:100%; height:42.96vh; display:flex; position:relative; }
  .half { flex:1; overflow:hidden; position:relative; background:#3a3a3a; }
  .half img { width:100%; height:100%; object-fit:cover; display:block; }
  .logo { position:absolute; top:36px; left:36px; font-size:30px; font-weight:900; letter-spacing:1px; z-index:5; text-shadow:0 2px 8px rgba(0,0,0,0.6); }
  .logo .a { color:{{PRIMARY}}; } .logo .b { color:#ffffff; }
  .logo img { height:30px; width:auto; display:block; } /* used instead of .a/.b spans when the brand has a real logo image, see LOGO_HTML */

  .textzone { flex:1; background:#0a0a0a; display:flex; flex-direction:column; align-items:{{TEXT_ALIGN_V|flex-start}}; justify-content:center; padding:70px 70px; }
  .caption { text-align:center; font-family:'Impact','Arial Narrow',Arial,sans-serif; font-size:{{CAPTION_SIZE|70px}}; line-height:1.16; letter-spacing:0.5px; text-transform:uppercase; }
  .caption .c1 { color:{{SECONDARY}}; }
  .caption .c2 { color:#ffffff; }
  .caption .c3 { color:{{PRIMARY}}; }

  /* Dual-mode like 4-vertical-split.html/8-photo-grid.html: fill .caption for a plain caption, or
     .stat/.statlbl for a stat takeover, leave the other pair's placeholders unset. Added 2026-07-18
     — this template previously had no dedicated stat treatment at all, so "stat mode" meant just
     writing the number as the first word of the normal 70px caption, which read as barely-bigger
     than the surrounding text instead of a real stat callout. */
  .stat { font-size:{{STAT_SIZE|150px}}; font-weight:900; color:{{SECONDARY}}; letter-spacing:-4px; line-height:1; text-align:center; }
  .statlbl { font-size:28px; font-weight:700; color:#9a9a9a; letter-spacing:1px; text-transform:uppercase; text-align:center; margin-top:10px; }
</style>
</head>
<body>
  <div class="slide">
    <div class="split">
      <div class="half l"><img src="{{IMG_LEFT}}" alt=""></div>
      <div class="half r"><img src="{{IMG_RIGHT}}" alt=""></div>
      <div class="logo">{{LOGO_HTML}}</div>
    </div>
    <div class="textzone">
      <!-- plain caption: use .caption, leave STAT_NUMBER/STAT_LABEL unset.
           stat takeover: use .stat + .statlbl, leave CAPTION_HTML unset. -->
      <div class="caption">{{CAPTION_HTML|}}</div>
      <div class="stat">{{STAT_NUMBER|}}</div>
      <div class="statlbl">{{STAT_LABEL|}}</div>
    </div>
  </div>
</body>
</html>
